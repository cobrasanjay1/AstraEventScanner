name: Build & Release Android App v2

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Decode Signing Keystore (if Secret exists)
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "keystore_created=true" >> $GITHUB_OUTPUT
          else
            echo "No KEYSTORE_BASE64 secret provided. Proceeding with unsigned build."
            echo "keystore_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK with Gradle
        env:
          KEYSTORE_FILE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Locate, Prepare and Rename Release APK
        id: prepare_apk
        run: |
          APK_SOURCE=""
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            APK_SOURCE="app/build/outputs/apk/release/app-release-unsigned.apk"
          else
            APK_SOURCE=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_SOURCE" ] || [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Release APK file not found!"
            exit 1
          fi

          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/' | tr -d '[:space:]')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0"
          fi
          TAG_NAME="v${VERSION_NAME}-build${{ github.run_number }}"

          FINAL_APK_NAME="AstraEventScanner-${TAG_NAME}.apk"
          cp "$APK_SOURCE" "$FINAL_APK_NAME"

          echo "Successfully prepared Release APK at: $FINAL_APK_NAME"
          echo "apk_path=$FINAL_APK_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: "Astra Event Scanner ${{ steps.prepare_apk.outputs.tag_name }}"
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
